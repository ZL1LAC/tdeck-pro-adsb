; T-Deck Pro ADS-B Tracker
; LilyGO T-Deck Pro v1.0 (ESP32-S3, 3.1" GDEQ031T10 e-paper, TCA8418 keyboard,
; CST328 touch, MIA-M10Q GNSS)

[env:t-deck-pro]
platform         = espressif32@^6.9.0
board            = t-deck-pro
framework        = arduino

monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder, time
upload_speed     = 921600

build_flags =
    -I src
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_T_DECK_PRO_V1_0
    -std=gnu++17
    -Wall
build_unflags =
    -std=gnu++11

lib_deps =
    zinggjm/GxEPD2@^1.6.4
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit TCA8418@^1.0.1
    bblanchon/ArduinoJson@^7.2.0
    mikalhart/TinyGPSPlus@^1.1.0

; Larger app partition + no OTA. Swap for a dual-OTA layout if you add updates.
board_build.partitions = default_16MB.csv
